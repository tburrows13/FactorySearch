[mod-setting-name]
fs-non-blocking-search=Bakgrundssökning
fs-chunks-per-tick=Kartsegment per tick
fs-initial-zoom=Zoomnivå
fs-clear-highlights-with-gui=Ta bort markeringar när gränssnittet stängs
fs-highlight-duration=Markeringarnas varaktighet

[mod-setting-description]
fs-non-blocking-search=Sökningen tar mycket längre tid men låser inte spelet.
fs-chunks-per-tick=Har bara effekt när bakgrundssökning är aktiverad.\nEtt lägre värde gör sökningarna långsammare men förbättrar prestandan medan sökningen pågår.
fs-initial-zoom=Zoomnivån som resultaten öppnas med. Ett högre värde innebär mer inzoomning.\nVanligen mellan [font=default-semibold]0,3[/font] och [font=default-semibold]3[/font].
fs-clear-highlights-with-gui=Ta bort markeringsrutor och pilar när gränssnittet stängs.
fs-highlight-duration=Antal sekunder som markeringsrutor och pilar visas.\n[font=default-semibold]0[/font] betyder [font=default-semibold]obegränsat[/font].

[string-mod-setting]
fs-non-blocking-search-on=På
fs-non-blocking-search-multiplayer=Endast flerspelarläge
fs-non-blocking-search-off=Av

